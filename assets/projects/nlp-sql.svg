<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">NLP to SQL project visual</title>
  <desc id="desc">Natural language prompt transformed into SQL query and database tables.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111a47"/><stop offset=".55" stop-color="#081328"/><stop offset="1" stop-color="#3a1463"/></linearGradient></defs>
  <rect width="960" height="540" rx="32" fill="url(#bg)"/>
  <rect x="98" y="128" width="310" height="120" rx="22" fill="#071225" stroke="#06b6d4" stroke-width="3"/>
  <text x="130" y="182" fill="#f8fafc" font-family="Arial, sans-serif" font-size="26" font-weight="700">Show top sales</text>
  <text x="130" y="220" fill="#93c5fd" font-family="Arial, sans-serif" font-size="20">natural language</text>
  <path d="M408 190h120" stroke="#7dd3fc" stroke-width="6" stroke-dasharray="16 14"/>
  <rect x="528" y="110" width="334" height="176" rx="22" fill="#071225" stroke="#8b5cf6" stroke-width="3"/>
  <text x="562" y="168" fill="#06b6d4" font-family="Consolas, monospace" font-size="28">SELECT *</text>
  <text x="562" y="212" fill="#e2e8f0" font-family="Consolas, monospace" font-size="24">FROM sales</text>
  <text x="562" y="252" fill="#e2e8f0" font-family="Consolas, monospace" font-size="24">ORDER BY total;</text>
  <g fill="#0f1b33" stroke="#06b6d4"><rect x="180" y="330" width="150" height="62" rx="14"/><rect x="390" y="330" width="150" height="62" rx="14"/><rect x="600" y="330" width="150" height="62" rx="14"/></g>
  <text x="214" y="369" fill="#e2e8f0" font-family="Arial" font-size="22">users</text>
  <text x="426" y="369" fill="#e2e8f0" font-family="Arial" font-size="22">orders</text>
  <text x="638" y="369" fill="#e2e8f0" font-family="Arial" font-size="22">sales</text>
</svg>
